<script>
(() => {
  const canvas = document.querySelector('.spacetime');
  const hero = canvas.closest('.hero');
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  const columns = 36;
  const rows = 26;
  let width, height, frame = 0;
  const cursor = {x:.72, y:.72, depth:.32};
  const target = {...cursor};

  function draw() {
    frame = 0;
    for (const key of ['x', 'y', 'depth']) cursor[key] += (target[key] - cursor[key]) * .15;
    const length = Math.min(width, height);
    const radius = length * .27;
    const cx = cursor.x * width;
    const cy = cursor.y * height;
    const points = Array.from({length: rows + 1}, (_, row) => {
      const t = row / rows;
      const y = height * (.27 + .83 * t ** 1.7);
      const spread = .55 + 1.45 * t;
      return Array.from({length: columns + 1}, (_, column) => {
        const x = width * (.5 + (column / columns - .5) * spread);
        const dx = x - cx;
        const dy = y - cy;
        const pull = cursor.depth * Math.exp(-(dx * dx + dy * dy) / (radius * radius));
        return [x - dx * pull * .24, y + length * .21 * pull];
      });
    });
    ctx.clearRect(0, 0, width, height);
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(51, 90, 153, .28)';
    ctx.beginPath();
    const trace = nodes => nodes.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    points.forEach(trace);
    for (let c = 0; c <= columns; c++) trace(points.map(row => row[c]));
    ctx.stroke();
    if (['x','y','depth'].some(key => Math.abs(cursor[key] - target[key]) > .001)) schedule();
  }

  function schedule() {
    if (!frame) frame = requestAnimationFrame(draw);
  }

  const resize = new ResizeObserver(() => {
    width = canvas.clientWidth;
    height = canvas.clientHeight;
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    schedule();
  });
  resize.observe(canvas);

  function rest() {
    Object.assign(target, {x:.72, y:.72, depth:.32});
    if (motion.matches) Object.assign(cursor, target);
    schedule();
  }
  hero.addEventListener('pointermove', event => {
    if (motion.matches || event.pointerType === 'touch') return;
    const rect = hero.getBoundingClientRect();
    Object.assign(target, {x:(event.clientX - rect.left) / rect.width, y:(event.clientY - rect.top) / rect.height, depth:1});
    schedule();
  }, {passive:true});
  hero.addEventListener('pointerleave', rest);
  motion.addEventListener('change', rest);
})();
</script>
</body>
